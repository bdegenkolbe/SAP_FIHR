# Export-Registry — IS-H/i.s.h.med → FHIR R4
# Tier 1 = klinischer Kern (Pflicht für Patient-360 + FHIR)
# Tier 2 = Analytik/Abrechnung (optional nachladbar)
# Tier 3 = on demand
#
# Schluessel im IS-H immer mandantenscharf. PK-Reihenfolge = Keyset-Sortierung.
# cdc: 'ct'       -> Qlik-Change-Table <tabelle>__ct (Spalte header__change_seq)
#      'watermark'-> Fallback ueber UPDAT/ERDAT (Datum, +1 Tag Ueberlappung + Dedup)
#      'full'     -> kein Delta (kleine Stammtabellen), immer Vollabzug
# storno: Spalte, deren Belegung -> FHIR status = entered-in-error

defaults:
  mandt: "100"          # verifiziert (Live-Stichprobe NPAT: MANDT=100)
  einri: "0001"         # verifiziert (Live: EINRI=0001). null = alle Einrichtungen
  partition_by: jahr    # abgeleitet aus fachlichem Datum bzw. ERDAT

tables:

  # ---- Tier 1: klinischer Kern -------------------------------------------
  NPAT:
    schema: sap
    fhir: Patient
    tier: 1
    pk: [MANDT, PATNR]                 # verifiziert R7 (leanx/sapdatasheet): KEIN EINRI im PK!
    cdc: ct
    partition_date: ERDAT
    notes: "Patientenstamm, MANDANTENWEIT (EINRI ist Attribut, FK->TN01). Adresse direkt auf
            NPAT (ORT/STRAS/PSTLZ/LAND) ODER via ADRNR+ADROB='NPAT'->NADR. Geschlecht GSCHL
            (1=m,2=w,3=unknown lt. Dict — Haus nutzt 3 evtl. divers, pruefen). Hausarzt
            HARNR->NGPA, Einweiser EARNR/UARNR->NGPA (-> Patient.generalPractitioner).
            Tod TODKZ/TODDT, Merge RFPAT."

  NFAL:
    schema: sap
    fhir: [Encounter, Account]
    tier: 1
    pk: [MANDT, EINRI, FALNR]
    cdc: ct
    storno: STORN
    partition_date: BEGDT
    notes: "Fall (einrichtungsbezogen, EINRI IM PK — anders als NPAT!). FALAR verifiziert R7
            (Domaene FALLART): 1=stationaer(IMP), 2=ambulant(AMB), 3=teilstat./Tagesfall(SS).
            KORREKTUR R7: Fallende = ENDDT (ENDDT_FAL), NICHT ENDAT (=Entbindungsdatum ENTDAT!).
            BEGDT=Fallbeginn. PATNR->NPAT. FACHR->TNKFA (Fachrichtung -> serviceType), BEKAT->TN24,
            ENDTYP->TN15D (Entlassart -> hospitalization.dischargeDisposition), FATYP->TN15C.
            PATGEW/PATGRO = Aufnahmegewicht/-groesse (Observation-Kandidaten)."

  NBEW:
    schema: sap
    fhir: Encounter        # Sub-Encounter je Bewegung + Encounter.location
    tier: 1
    pk: [MANDT, EINRI, FALNR, LFDNR]
    cdc: ct
    storno: STORN
    partition_date: BWIDT
    notes: "Bewegung. PK verifiziert R7 (sapdatasheet). BEWTY (1=Aufnahme/2=Entlassung/
            3=Verlegung/4=amb.Besuch/6=Beurlaubung, via TN14T). Zeitraum BWIDT/BWIZT-BWEDT/BWEZT.
            Kette: VGNREF(Vorgaenger)/NFGREF(Nachfolger) -> NBEW.LFDNR (LFDREF veraltet).
            OE: ORGFA(fachlich)/ORGPF(pflegerisch)/ORGAU(aufnehmend) -> NORG.ORGID (8-stellig).
            Ort: ZIMMR(Raum)/BETT(Bett) -> NBAU. Bewegungsgrund BWGR1(Pos1-2)+BWGR2(Pos3-4) ->
            TN14G. Entlasszustand EZUST -> TN14D (Encounter.hospitalization.dischargeDisposition).
            Einweisungsart RFSRC -> TN14H, Anreiseart UNFAV -> TN14K (admitSource). FACHR->TNKFA,
            CLASS->TNP01, OPART->TN14O, BEKAT->TN24, EXTKH->NGPA (externes KH)."

  NDIA:
    schema: sap
    fhir: Condition
    tier: 1
    pk: [MANDT, EINRI, FALNR, LFDNR]   # verifiziert (+ LFDBEW Bewegungsbezug)
    cdc: ct
    storno: STORN                      # verifiziert
    partition_date: DIADT              # verifiziert
    notes: "Diagnose. ICD=DKEY1, Katalog=DKAT1('56'=ICD-10-GM), Sekundaer=DKEY2/DKAT2
            (Kreuz-Stern), Klartext=DITXT, Sicherheit=DIASI. Verwendung ueber Flags
            KHDIA/FHDIA/ENDIA/AFDIA/EWDIA. DRG: DRG_CATEGORY/CCL. Referenz FALNR."

  NDIP:
    schema: sap
    fhir: null            # anreichernd (Diagnose-Pool/Vorschlag), kein eigener Ressourcentyp
    tier: 2
    pk: [MANDT, DIPNO]                 # verifiziert R9 gegen replicate (694.408/694.408 eindeutig)
    cdc: ct
    notes: "KORREKTUR R9: NICHT [MANDT,EINRI,FALNR,LFDNR]. Diagnose-Pool/-Position
            (Vorschlags-/Sammeldiagnosen). PK DIPNO. DCAT/DKEY=ICD, DLOC=Lokalisation,
            VKGID=Kontext. Anreicherung; nicht fallbezogen ueber FALNR/LFDNR."

  NICP:
    schema: sap
    fhir: Procedure
    tier: 1
    pk: [MANDT, LNRIC]                 # verifiziert R8: PK=[MANDT,LNRIC]. LFDBEW ist NICHT PK,
    cdc: ct                            # sondern FK->NBEW (Bewegungsbezug).
    storno: STORN
    partition_date: BGDOP              # verifiziert: OP-Beginn (ISH_BEGDT_ICP)
    notes: "Prozedur (OPS). Verifiziert R8 (sapdatasheet, alle Pfade). PK [MANDT,LNRIC]
            (ISH_LNRIC, global eindeutig). LFDBEW=FK->NBEW (welche Prozedur in welcher
            Bewegung). Kode ICPML(ICPM_LS), Katalog ICPMK(ICPM_ID,'36'=OPS) FK->TNK01,
            Klartext BTEXT, OP-Zeit BGDOP/BZTOP..ENDOP/EZTOP. OE ORGFA=ISH_FACHOE_PROC
            (fachlich, ->NORG, TRAEGT den Procedure.performer), ORGPF=ISH_ERBOE_PROC
            (erbringend, ->NORG). Lokalisation LSLOK=ISH_PROC_LOC FK->TN26E (->bodySite),
            OP-Art OPART FK->TN14O (->category). FALNR/EINRI denormalisiert (FK->NFAL/TN01);
            PATNR fehlt -> subject via Pipeline-Kontext (FALNR->NFAL->PATNR)."

  N2LABOR:
    schema: sap
    fhir: DiagnosticReport # Kopf/Anforderung (verifiziert R6: NICHT die Wertzeile!)
    tier: 1
    pk: [MANDT, DOKAR, DOKNR, DOKVR, DOKTL]   # verifiziert R6 (i.s.h.med-Dokumentschluessel)
    cdc: ct
    partition_date: N2LADATUM                 # verifiziert R6 (Befunddatum; +N2LATIME)
    notes: "Laborbefund-KOPF i.s.h.med (14,96 Mio). Ein Dok je Anforderung/Panel.
            N2LAPATNR/N2LAFALNR/N2LAEINRI=Bezug, N2LADATUM/N2LATIME=Befunddatum,
            N2LASTATUS, N2KATID/N2KATTEXT=Kategorie, N2PARENT=Elterndok, N2LASYSTEM=Quelle.
            -> DiagnosticReport; die Werte liegen in N2LABOR001 (Join ueber DOK-Schluessel)."
  N2LABOR001:
    schema: sap
    fhir: Observation      # category=laboratory — je Analyt eine Observation
    tier: 1
    pk: [MANDT, DOKAR, DOKNR, DOKVR, DOKTL, MUSEQ]   # verifiziert R6 (Kopf-Schluessel + Zeilennr.)
    cdc: ct
    partition_date: N2DATE
    notes: "Laborbefund-WERTZEILE (322 Mio! GROESSTE klinische Tabelle -> schmale Projektion +
            Backfill im Lastfenster). Join auf N2LABOR ueber DOKAR/DOKNR/DOKVR/DOKTL.
            N2VALUE=Wert(60), N2UNIT=Einheit, N2VALUETYP=Werttyp (num/Text/kodiert),
            N2NORMAL=Referenzbereich, N2ABNORMAL=Abweichung->interpretation, N2LEISTID=Testcode
            (->LOINC via loinc_map), N2DATE/N2TIME=Analytzeit. -> Observation (valueQuantity
            wenn numerisch, sonst valueString; subject/encounter/status aus N2LABOR-Kopf)."

  NDOC:
    schema: sap
    fhir: DocumentReference
    tier: 1
    pk: [MANDT, DOKAR, DOKNR, DOKVR, DOKTL, LFDDOK]   # verifiziert R8 (KORR: NICHT EINRI/DOCID)
    cdc: ct
    storno: STORN
    partition_date: DODAT              # verifiziert R8: Dokumentdatum (N2_DODAT, +DOTIM)
    notes: "ZUORDNUNG IS-H-Objekt <-> DVS-Dokument (nicht Kopf/Inhalt). Verifiziert R8
            (sapdatasheet + replicate). KORREKTUR R8: fruehere Feldnamen DOCID/DOCKA/DOCDT/DOCTX
            existieren NICHT. PK = DVS-Schluessel DOKAR/DOKNR/DOKVR/DOKTL + LFDDOK.
            Bezug: PATNR FK->NPAT, FALNR FK->NFAL, LFDBEW FK->NBEW, EINRI FK->TN01.
            Kategorie DTID FK->N2DT, MEDOK=medizin. Dokument. Autor MITARB(N1MITARB) FK->NGPA
            (Practitioner), dokumentierende OE ORGDO FK->NORG. Datum DODAT/DOTIM. STORN/LOEKZ
            -> status=entered-in-error. Volltext NICHT hier -> N2TEXT.TXT (DuckDB-FTS)."

  N2TEXT:
    schema: sap
    fhir: null             # Volltext -> DuckDB-FTS, nicht FHIR
    tier: 1
    pk: [MANDT, DOKAR, DOKNR, DOKVR, DOKTL, DOKTAB, DOKFLD, DOKOCC]   # verifiziert R8
    cdc: ct
    notes: "IS-H*MED-Texte parametrierter Dokumente. Verifiziert R8 (sapdatasheet + replicate).
            KORREKTUR R8: PK ist NICHT [EINRI,TEXTID], sondern DVS-Schluessel
            DOKAR/DOKNR/DOKVR/DOKTL + DOKTAB (Quelltabelle) + DOKFLD (Feld) + DOKOCC
            (Vorkommen-Index). Freitext in Spalte TXT (N2_TXT8070, LCHR 8070), Laenge TLNG.
            Join an NDOC/DVS ueber DOKAR/DOKNR/DOKVR/DOKTL. Ziel: FTS5/DuckDB-FTS (doc_search)."

  NORG:
    schema: sap
    fhir: [Organization, Location]
    tier: 1
    pk: [MANDT, ORGID]                 # verifiziert R7: ORGID allein (EINRI ist Attribut->TN01)
    cdc: full
    notes: "Organisationseinheiten. ORGID(8)=Schluessel, OKURZ(5)=App-Kuerzel, ORGNA=Name,
            ORGTY->TN10A (OE-Kategorie), FACHR*=Fachrichtungen (->Encounter.serviceType),
            ADRNR+ADROB='NORG'->NADR. SCHLUESSELPFAD: NBEW/NICP.ORGFA/ORGPF(8)->NORG.ORGID.
            Hierarchie zusaetzlich aus hrp.HRP1001."

  NADR:
    schema: sap
    fhir: null             # Adresse -> *.address (bei privacy=off)
    tier: 1
    pk: [MANDT, ADRNR, ADROB]          # verifiziert R7: ADROB (Adressobjekttyp) IM Schluessel!
    cdc: ct
    notes: "Zentrale Adressverwaltung. SCHLUESSELPFAD: JEDES Objekt joint mit ADRNR+ADROB,
            wobei ADROB den Typ nennt (NPAT/NGPA/TN01/NORG/NBAU...). Felder ORT/STRAS/PSTLZ/
            LAND/EMAIL/TELNR (NICHT ORT01/LAND1). Join ohne ADROB liefert Fehltreffer."

  # ---- Tier 2: Analytik / Abrechnung -------------------------------------
  NDRG:
    schema: sap
    fhir: null             # -> Encounter-Extension + optional Claim; CMI im Gold-Layer
    tier: 2
    pk: [CLIENT, INSTITUTION, PATCASEID, DRG_SEQNO]   # verifiziert R9 (4,15 Mio eindeutig)
    cdc: watermark
    watermark_col: DRG_CREAT_DATE
    notes: "DRG-Gruppierung. KORREKTUR R9: ENGLISCHE Spaltennamen (CLIENT/INSTITUTION/PATCASEID
            statt MANDT/EINRI/FALNR)! PK [CLIENT,INSTITUTION,PATCASEID,DRG_SEQNO]. DRG_CODE,
            MDC_CODE, DRG_CAT, SOI/ROM (Schweregrad), DRG_REGROUP. Join FALNR=PATCASEID."

  NLEI:
    schema: sap
    fhir: null             # -> ChargeItem (Analytik), sehr gross (~210 Mio)
    tier: 2
    pk: [MANDT, LNRLS]                 # verifiziert R9 (LNRLS global; NLEM analog bestaetigt,
    cdc: watermark                     # NLEI-Vollcount time-out bei ~210 Mio)
    watermark_col: UPDAT
    notes: "Leistungen. GROESSTE Tabelle. KORREKTUR R9: PK [MANDT,LNRLS] (LNRLS=Leistungs-
            Lfd.Nr., global eindeutig), NICHT [EINRI,FALNR,LFDNR]. EINRI/FALNR/ORGID/LEIST/
            LFDBEW denormalisiert. Backfill 1-2 Naechte, schmale Projektion Pflicht."

  NLEM:
    schema: sap
    fhir: null
    tier: 2
    pk: [MANDT, LNRLS]                 # verifiziert R9 gegen replicate (22,45 Mio eindeutig)
    cdc: watermark
    watermark_col: UPDAT
    notes: "KORREKTUR R9: PK [MANDT,LNRLS] (nicht [EINRI,FALNR,LFDNR]). Leistungs-Status/Detail
            je LNRLS: PATNR, ANFID=Anforderung, LSSTAE=Status, STOID=Stornogrund, WBGDT/WBGZT.
            Join an NLEI ueber LNRLS."

  N1CORDER:
    schema: sap
    fhir: ServiceRequest
    tier: 2
    pk: [MANDT, CORDERID]              # verifiziert R8 (KORR: NICHT EINRI/ORDID)
    cdc: ct
    storno: STORN
    partition_date: ERDAT
    notes: "Klinische Auftraege i.s.h.med. Verifiziert R8 (sapdatasheet + replicate). KORREKTUR R8:
            PK [MANDT, CORDERID] (N1CORDID = 32-stellige UUID, SYSUUID_C), NICHT das
            geratene ORDID. PATIENTENbezogen: PATNR FK->NPAT (PAPID=provisor. Patient,
            REFTYP steuert). KEIN FALNR. Titel CORDTITLE, Fragestellung FRAGE, Kurzanamnese
            KANAM, Prioritaet ORDPRI(N1APRI). Auftraggeber ETRGP(RI_KUNNR)->NGPA, initiierende
            OE ORDDEP/ETROE(ORGID)->NORG. ERDAT/ERTIM=Anlage, STORN->revoked. Mapper
            map_servicerequest R8 hinzugefuegt + getestet."

  NAPP:
    schema: sap
    fhir: Appointment
    tier: 2
    pk: [MANDT, LNRAPP]                # verifiziert R9 gegen replicate (11,5 Mio eindeutig)
    cdc: ct
    notes: "Termine. KORREKTUR R9: PK [MANDT,LNRAPP] (kein APPID). EINRI/FALNR denormalisiert,
            DSPTY/VISTY=Termin-/Besuchsart, BWIDT/BWIZT=Zeit, STATU=Status, ORGFA/ORGPF->NORG."

  NFPZ:
    schema: sap
    fhir: null            # -> Encounter.participant / Practitioner (behandelnde Person je Fall)
    tier: 2
    pk: [MANDT, EINRI, FALNR, PERNR, LFDNR]   # verifiziert R9 gegen replicate (26,76 Mio eindeutig)
    cdc: ct
    storno: STORN
    notes: "KORREKTUR R9: NICHT Versicherung/Coverage! NFPZ = Fall<->behandelnde PERSON
            (Arzt-/Personalzuordnung je Fall). PERNR->NPER/Practitioner, FARZT=Funktion der
            Person im Fall (Live R12: 1/2/5/6/7/9/E; Katalog nicht repliziert -> Rohcode
            urn:ish:farzt), BEGDT/ENDDT=Zeitraum, STORN. Coverage kommt aus NKSK, NICHT
            aus NFPZ. MAPPER R12: map_encounter(..., personal=[NFPZ-Zeilen]) ->
            Encounter.participant mit Referenz Practitioner(PractitionerNper, PERNR).
            DIAS-Baum: 28 Referenzen -> im Haus zentral."

  # ---- HR / Orga (hrp) ----------------------------------------------------
  HRP1000:
    schema: hrp
    fhir: null
    tier: 2
    pk: [MANDT, PLVAR, OTYPE, OBJID]   # VERIFY SAP-OM-Schluessel
    cdc: watermark
    watermark_col: UPDAT
    notes: "OM-Objekte (Orgeinheiten/Planstellen). -> Organization-Baum."

  HRP1001:
    schema: hrp
    fhir: null
    tier: 2
    pk: [MANDT, PLVAR, OTYPE, OBJID, SUBTY, ISTAT, BEGDA, SEQNR]  # VERIFY
    cdc: watermark
    watermark_col: UPDAT
    notes: "OM-Verknuepfungen (A/B 002/003) -> OE-Hierarchie."

  PA0002:
    schema: hrp
    fhir: Practitioner
    tier: 3
    pk: [MANDT, PERNR, SUBTY, OBJPS, SPRPS, ENDDA, BEGDA, SEQNR]  # VERIFY PA-Schluessel
    cdc: watermark
    watermark_col: null
    notes: "Personalstammdaten -> Practitioner. Pseudonymisierbar (Konfig-Schalter)."

  # ===== v0.2-Erweiterung: Referenz-/Katalogschicht (Prioritaet 1) =========
  # Kleine, selten aendernde Kataloge. cdc: full. Ausleitung als FHIR-Terminologie
  # + DuckDB-Lookups ref_*. Loesen die hartkodierten Enums in den Mappern ab.
  NGPA:
    schema: sap
    fhir: [Practitioner, Organization]
    tier: 1
    pk: [MANDT, GPART]                 # verifiziert R7: GPART allein (KEIN EINRI, KEIN GPTYP!)
    cdc: full
    notes: "Geschaeftspartner. Rolle NICHT im Schluessel, sondern als Flag-Felder: PERS='X'
            ->Arzt/Mitarbeiter (Practitioner), KRKHS/KOSTR/INSTN ->Institution/Kasse
            (Organization). Ein Partner kann mehrere Rollen tragen. NAME1=Nachname,
            NAME2=Vorname, TITEL, GSCHL, INSTN=IK, ADRNR+ADROB='NGPA'->NADR. Ziel von
            NPAT.HARNR/EARNR/UARNR und NDIA.DIAPE."
  NKTR:
    schema: sap
    fhir: Organization                 # payer
    tier: 1
    pk: [MANDT, KOSTR]                 # verifiziert R6 (KEIN EINRI im PK!)
    cdc: full
    notes: "Kostentraeger-Stammdaten (68 Sp.). KSSNM=Kassenname -> Organization.name,
            PM301=IK der Kasse -> identifier(iknr), KTART/KTTYP=Kassenart, LOEKZ=inaktiv.
            ID-Schema OrgKostr == map_coverage.payor. Mapper map_organization_kostentraeger."
  NFKL:
    schema: sap
    fhir: null                         # -> Encounter (Fachabteilungs-/Klassifikationszeiten)
    tier: 2
    pk: [MANDT, EINRI, FALNR, KLFTYP, KLFART, FKLBDT, FKLBZT]  # verifiziert R9 (5,72 Mio, effektiv eindeutig)
    cdc: ct
    notes: "KORREKTUR R9: KEIN Fachabteilungs-Katalog! NFKL = fachliche Klassifikation/
            Fachabteilungsverlauf JE FALL, zeitscharf. KLFTYP/KLFART=Typ/Art, FKLBDT/FKLBZT..
            FKLEDT/FKLEZT=Gueltigkeit. -> Encounter-Fachabteilungszeiten. Der §301-FAB-Schluessel
            liegt in TNKFA, nicht hier."
  NBKZ:
    schema: sap
    fhir: null                         # transaktional (Betriebskennzeichen je Fall/Beleg)
    tier: 2
    pk: [MANDT, EINRI, FALNR, LFDNR, BELNR]   # verifiziert R9 gegen replicate (13,73 Mio eindeutig)
    cdc: ct
    storno: STORN
    notes: "KORREKTUR R9: KEIN Katalog! NBKZ ist transaktional — Betriebs-/Belegkennzeichen
            je Fall/Bewegung/Beleg (FALNR,LFDNR,BELNR,STORN). PK [MANDT,EINRI,FALNR,LFDNR,BELNR].
            Bewegungsart-Texte liegen in TN14T (nicht hier)."
  NKDI:
    schema: sap
    fhir: null                         # -> Condition.code.text (Diagnose-Kodetext-Katalog)
    tier: 1
    pk: [MANDT, SPRAS, DKAT, DKEY]     # verifiziert R9 gegen replicate (390.504/390.504 eindeutig)
    cdc: full
    notes: "KORREKTUR R9: NICHT Diagnosearten. NKDI = Diagnose-Kode-TEXTkatalog (ICD-Texte je
            Sprache). SPRAS+DKAT(Katalog)+DKEY(Kode)->DTEXT1-3. REF_DKAT/REF_DKEY=Verweiskatalog.
            Macht NDIA.DKEY1/DKAT1 sprechend (Condition.code.text-Quelle)."
  NLOC:
    schema: sap
    fhir: null            # Belegungs-/Ortszuordnung (zeitscharf); in DIESEM Haus LEER
    tier: 3
    pk: [MANDT, ORGPF, PELOC]          # VERIFY (0 Zeilen in diesem Haus -> nicht testbar)
    cdc: ct
    notes: "KORREKTUR R9: KEINE Standort-Stammdaten (die liegen in NBAU). NLOC = zeitscharfe
            Belegungs-/Ortszuordnung (ORGPF, PELOC, POBNR, LOCBD/LOCBT..LOCED/LOCET). In DIESEM
            Haus LEER (0 Zeilen) -> Encounter.location kommt aus NBEW.ZIMMR/BETT (NBAU)."
  NPER:
    schema: sap
    fhir: Practitioner
    tier: 1
    pk: [MANDT, PERNR]                 # verifiziert R9 gegen replicate (kein EINRI in NPER; 236k)
    cdc: full
    notes: "Personen-/Personalbezug IS-H (behandelnde Person). KORREKTUR R9: PK [MANDT,PERNR]
            (KEIN EINRI in NPER). R12 verifiziert: KEINE Namensfelder (Name aus NGPA bzw.
            HR/PA0002). FIXLANR=lebenslange Arztnummer -> identifier LANR (fhir.de/sid/kbv/
            lanr), FACHR->TNKFA (qualification), ARZT/ARZTN/PFLEG/BARZT=Rollen-Flags.
            BEFUND R13 (replicate): NGPA.GPART == NPER.PERNR fuer ALLE 236.114 Personen
            (PERS='X') — 1:1, dieselbe Person unter demselben Schluessel! KEIN Dubletten-
            abgleich noetig; PNUMB ist NICHT der Link (nur 569 belegt, 0 Treffer).
            MAPPER R13: map_practitioner_nper nutzt das GEMEINSAME ID-Schema 'Practitioner'
            (== NGPA-map_practitioner == NFPZ-participant == NPAT.generalPractitioner).
            Pipeline mergt NGPA-Anteil (Name/Titel/IK) + NPER-Anteil (LANR/FACHR/Rollen)
            zu EINER Practitioner-Ressource."
  NKSP:
    schema: sap
    fhir: null                         # Abrechnungs-Splitting, kein FHIR-Kern
    tier: 3
    pk: [MANDT, BELNR, POSNR]          # verifiziert
    cdc: ct
    notes: "KORRIGIERT (v-Runde2): Kostenuebernahme-Splitting/Pflegesatz-Positionen,
            NICHT Sperrvermerke. Sperr-/VIP-Flag liegt in NPAT.VIPKZ/RISKF.
            Tier 3, nur fuer Erloes-/Splitting-Analytik."

  # ===== v0.3: Coverage / Geburt / Location (verifiziert Runde 2) ==========
  NKSK:
    schema: sap
    fhir: Coverage                     # zentrale Kostenuebernahme je Fall
    tier: 1
    pk: [MANDT, BELNR]                 # verifiziert (BELNR Kopf; FALNR+KOSTR als Attribute)
    cdc: ct
    storno: STORN
    notes: "Kostenuebernahme/Versicherung je Fall (9,5 Mio). FALNR->Fall, KOSTR->NKTR,
            Gueltigkeit BEGDT/ENDDT, KSTYP/KSART. KOSTR=0009999999=Selbstzahler.
            Ersetzt NFPZ als primaere Coverage-Quelle."
  NGEB:
    schema: sap
    fhir: Observation                  # Geburts-/Perinataldaten
    tier: 2
    pk: [MANDT, EINRI, FALN1, LFDNR]   # verifiziert (FALN1 Mutter/Kind, FALN2 Gegenfall)
    cdc: ct
    storno: STORN
    partition_date: GBDAT
    notes: "Geburten/Perinatal (61k). GBDAT/GBTIM, GBGEW(Gewicht), GBGRO(Laenge),
            HEAD_SIZE(Kopfumfang), BIRTH_POS(Lage), MEHRL(Mehrling), BIRTH_ANO.
            FALN1<->FALN2 verbindet Mutter- und Kind-Fall."
  NBAU:
    schema: sap
    fhir: Location                     # Gebaeude/Baustruktur
    tier: 2
