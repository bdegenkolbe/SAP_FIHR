# Export-Registry — IS-H/i.s.h.med → FHIR R4
# Tier 1 = klinischer Kern (Pflicht für Patient-360 + FHIR)
# Tier 2 = Analytik/Abrechnung (optional nachladbar)
# Tier 3 = on demand
#
# Schluessel im IS-H immer mandantenscharf. PK-Reihenfolge = Keyset-Sortierung.
# cdc: 'ct'       -> Qlik-Change-Table <tabelle>__ct (Spalte header__change_seq)
#      'watermark'-> Fallback ueber UPDAT/ERDAT (Datum, +1 Tag Ueberlappung + Dedup)
#      'full'     -> kein Delta (kleine Stammtabellen), immer Vollabzug
# storno: Spalte, deren Belegung -> FHIR status = entered-in-error

defaults:
  mandt: "100"          # verifiziert (Live-Stichprobe NPAT: MANDT=100)
  einri: "0001"         # verifiziert (Live: EINRI=0001); null = alle Einrichtungen
  partition_by: jahr    # abgeleitet aus fachlichem Datum bzw. ERDAT

tables:

  # ---- Tier 1: klinischer Kern -------------------------------------------
  NPAT:
    schema: sap
    fhir: Patient
    tier: 1
    pk: [MANDT, PATNR]     # Patient ist einrichtungsunabhaengig (KEIN EINRI im Schluessel);
                           # VERIFY gegen INFORMATION_SCHEMA der Replika (ANALYSE A6)
    cdc: ct
    partition_date: ERDAT
    notes: "Stammdaten. Adresse ueber NADR (ADRNR), Geschlecht GSCHL VERIFY-Enum."

  NFAL:
    schema: sap
    fhir: [Encounter, Account]
    tier: 1
    pk: [MANDT, EINRI, FALNR]
    cdc: ct
    storno: STORN
    partition_date: BEGDT
    notes: "Fall. FALAR -> Encounter.class (1=stationaer/2=ambulant/3=teilstat. VERIFY).
            PATNR-Referenz auf NPAT. ENDAT/ENTIM Fallende, BEGDT Fallbeginn."

  NBEW:
    schema: sap
    fhir: Encounter        # Sub-Encounter je Bewegung + Encounter.location
    tier: 1
    pk: [MANDT, EINRI, FALNR, LFDNR]
    cdc: ct
    storno: STORN
    partition_date: BWIDT
    notes: "Bewegung. BEWTY (Aufnahme/Verlegung/Entlassung/amb. Besuch VERIFY),
            ORGFA/ORGPF -> OE, Zeitraum BWIDT/BWIZT-BWEDT/BWEZT, LFDREF/VGNREF Kette."

  NDIA:
    schema: sap
    fhir: Condition
    tier: 1
    pk: [MANDT, EINRI, FALNR, LFDNR]   # verifiziert (+ LFDBEW Bewegungsbezug)
    cdc: ct
    storno: STORN                      # verifiziert
    partition_date: DIADT              # verifiziert
    notes: "Diagnose. ICD=DKEY1, Katalog=DKAT1('56'=ICD-10-GM), DKEY2 meist Katalog-
            Redundanz (nur bei DKEY1<>DKEY2 echtes 2. Coding). Klartext=DITXT,
            Sicherheit=DIAGW (Altbestand; DIASI leer), Lokalisation=DIALO.
            Verwendung ueber Flags KHDIA/FHDIA/AFDIA/ENDIA/EWDIA/BHDIA/OPDIA/DIAPR.
            Klartexte je Kode aus NKDI (Referenzschicht)."

  NDIP:
    schema: sap
    fhir: null            # anreichernd, kein eigener Ressourcentyp
    tier: 1
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: ct
    notes: "Diagnose-Verwendung/Position -> Condition.category (HD/ND) VERIFY."

  NICP:
    schema: sap
    fhir: Procedure
    tier: 1
    pk: [MANDT, LNRIC]                 # verifiziert: eigener Prozedur-PK, NICHT FALNR/LFDNR
    cdc: ct
    storno: STORN
    partition_date: BGDOP              # verifiziert: OP-Beginn
    notes: "Prozedur (OPS). Kode=ICPML, Katalog=ICPMK('36'=OPS), Klartext=BTEXT,
            OP-Zeit=BGDOP/ENDOP+BZTOP/EZTOP, OE=ORGFA/ORGPF, LFDBEW=Bewegungsbezug.
            FALNR denormalisiert vorhanden."

  N2LABOR:
    schema: sap
    fhir: Observation      # category=laboratory
    tier: 1
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY (i.s.h.med-Schluessel weicht ab)
    cdc: ct
    partition_date: null   # VERIFY Befunddatum
    notes: "Laborbefund i.s.h.med. Wert/Einheit/Referenzbereich. LOINC-Map als Konfig
            (Start: hauseigene Codes als CodeableConcept.text)."

  NDOC:
    schema: sap
    fhir: DocumentReference
    tier: 1
    pk: [MANDT, EINRI, DOCID]          # VERIFY
    cdc: ct
    partition_date: null               # VERIFY
    notes: "Dokument-Kopf. Volltext liegt in N2TEXT, NICHT in FHIR (nur Referenz +
            Kategorie). Binary optional."

  N2TEXT:
    schema: sap
    fhir: null             # Volltext -> DuckDB-FTS, nicht FHIR
    tier: 1
    pk: [MANDT, EINRI, TEXTID]         # VERIFY
    cdc: ct
    notes: "Med. Texte/Dokumentinhalte. Ziel: FTS5/DuckDB-FTS fuer doc_search."

  NORG:
    schema: sap
    fhir: [Organization, Location]
    tier: 1
    pk: [MANDT, EINRI, ORGID]          # VERIFY
    cdc: full
    notes: "Organisationseinheiten. Hierarchie zusaetzlich aus hrp.HRP1001."

  NADR:
    schema: sap
    fhir: null             # Adresse -> Patient.address (bei privacy=off)
    tier: 1
    pk: [MANDT, ADRNR]                 # VERIFY
    cdc: ct
    notes: "Adressen. Join ueber NPAT.ADRNR."

  # ---- Tier 2: Analytik / Abrechnung -------------------------------------
  NDRG:
    schema: sap
    fhir: null             # -> Encounter-Extension + optional Claim; CMI im Gold-Layer
    tier: 2
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: watermark
    watermark_col: UPDAT
    notes: "DRG-Gruppierung. DRG-Kode, Bewertungsrelation -> CMI."

  NLEI:
    schema: sap
    fhir: null             # -> ChargeItem (Analytik), sehr gross (~210 Mio)
    tier: 2
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: watermark
    watermark_col: UPDAT
    notes: "Leistungen. GROESSTE Tabelle. Backfill 1-2 Naechte. Schmale Projektion Pflicht."

  NLEM:
    schema: sap
    fhir: null
    tier: 2
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: watermark
    watermark_col: UPDAT
    notes: "Leistungspositionen (Detail zu NLEI)."

  N1CORDER:
    schema: sap
    fhir: ServiceRequest
    tier: 2
    pk: [MANDT, EINRI, ORDID]          # VERIFY
    cdc: ct
    notes: "Klinische Auftraege i.s.h.med."

  NAPP:
    schema: sap
    fhir: Appointment
    tier: 2
    pk: [MANDT, EINRI, APPID]          # VERIFY
    cdc: ct
    notes: "Termine."

  NFPZ:
    schema: sap
    fhir: null                         # abgeloest: NKSK ist die primaere Coverage-Quelle
    tier: 3
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: ct
    notes: "Versicherungsverhaeltnis je Fall (alt). Primaere Coverage-Quelle ist NKSK
            (verifiziert Runde 2); NFPZ nur noch als Vergleichs-/Altquelle."

  # ---- HR / Orga (hrp) ----------------------------------------------------
  HRP1000:
    schema: hrp
    fhir: null
    tier: 2
    pk: [MANDT, PLVAR, OTYPE, OBJID]   # VERIFY SAP-OM-Schluessel
    cdc: watermark
    watermark_col: UPDAT
    notes: "OM-Objekte (Orgeinheiten/Planstellen). -> Organization-Baum."

  HRP1001:
    schema: hrp
    fhir: null
    tier: 2
    pk: [MANDT, PLVAR, OTYPE, OBJID, SUBTY, ISTAT, BEGDA, SEQNR]  # VERIFY
    cdc: watermark
    watermark_col: UPDAT
    notes: "OM-Verknuepfungen (A/B 002/003) -> OE-Hierarchie."

  PA0002:
    schema: hrp
    fhir: Practitioner
    tier: 3
    pk: [MANDT, PERNR, SUBTY, OBJPS, SPRPS, ENDDA, BEGDA, SEQNR]  # VERIFY PA-Schluessel
    cdc: watermark
    watermark_col: null
    notes: "Personalstammdaten -> Practitioner. Pseudonymisierbar (Konfig-Schalter)."

  # ===== Fallzusammenfuehrung (verifiziert Runde 1 + Altbestand) ============
  # NAPX/NAPX_FAL = GKV-rechtliche Fallzusammenfuehrung nach FPV/KFPV — ersetzt
  # die heuristische 30-Tage-Wiederaufnahme im Graph. REASON-Klartexte aus dem
  # produktiven Altbestand (docs/ALTBESTAND_ANALYSE.md §4).
  NAPX:
    schema: sap
    fhir: null
    tier: 1
    pk: [MANDT, APXNR]                 # verifiziert
    cdc: ct
    storno: STORN
    notes: "Kopf der Fallzusammenfuehrung. Bereinigungsregel Altbestand:
            STDAT=ERDAT (am Erstellungstag storniert) = Fehleingabe, ausfiltern."
  NAPX_FAL:
    schema: sap
    fhir: null                         # -> Graph-Kante FUEHRT_ZUSAMMEN
    tier: 1
    pk: [MANDT, EINRI, APXNR, FALNR]   # verifiziert
    cdc: ct
    notes: "APXNR<->FALNR mit LEAD ('X'=fuehrender Fall) und REASON
            (WA/KO/WP/RV/FW/OG/MD/RP — Klartexte s. ALTBESTAND_ANALYSE §4).
            Live: 21.991 Zusammenfuehrungen / 45.081 Fallzeilen."

  # ===== Coverage / Geburt / Location (verifiziert Runde 2) =================
  NKSK:
    schema: sap
    fhir: Coverage                     # zentrale Kostenuebernahme je Fall
    tier: 1
    pk: [MANDT, BELNR]                 # verifiziert (BELNR Kopf; FALNR/KOSTR Attribute)
    cdc: ct
    storno: STORN
    notes: "Kostenuebernahme/Versicherung je Fall (9,5 Mio). FALNR->Fall, KOSTR->NKTR,
            Gueltigkeit BEGDT/ENDDT, KSTYP/KSART. KOSTR=0009999999=Selbstzahler.
            Primaere Coverage-Quelle (ersetzt NFPZ)."
  NGEB:
    schema: sap
    fhir: Observation                  # Geburts-/Perinataldaten
    tier: 2
    pk: [MANDT, EINRI, FALN1, LFDNR]   # verifiziert (FALN1 Kind-Fall, FALN2 Gegenfall)
    cdc: ct
    storno: STORN
    partition_date: GBDAT
    notes: "Geburten/Perinatal (61k). GBGEW(Gewicht), GBGRO(Laenge), HEAD_SIZE
            (Kopfumfang), BIRTH_POS, MEHRL, BIRTH_ANO. FALN1<->FALN2 Mutter/Kind."
  NBAU:
    schema: sap
    fhir: Location                     # Gebaeude/Baustruktur
    tier: 2
    pk: [MANDT, BAUID]                 # verifiziert
    cdc: full
    notes: "Baustruktur/Gebaeude (4,5k). BAUNA, BAUTY, XKOOR/YKOOR (Geo), ADRNR."

  # ===== Referenz-/Katalogschicht (Prioritaet 1, cdc: full) =================
  # Quellen laut produktivem Altbestand (ALTBESTAND_ANALYSE §3) — NICHT die in
  # CONCEPT_EXT §2 vermuteten NBKZ/NFKL. Machen aus Rohcodes lesbare Auswertungen
  # und loesen die hartkodierten Mapper-Enums ab.
  TN14T:
    schema: sap
    fhir: null                         # -> CodeSystem Bewegungstyp (BEWTY!)
    tier: 1
    pk: [MANDT, EINRI, BEWTY]          # VERIFY (sprachabhaengig SPRAS?)
    cdc: full
    notes: "Bewegungstyp-Texte — die autoritative BEWTY-Enum-Quelle."
  TN14R:
    schema: sap
    fhir: null                         # -> CodeSystem Bewegungsgrund
    tier: 1
    pk: [MANDT, BEWTY, GRPOS, BWGRU]   # VERIFY (Schluessel lt. Altbestand MANDT+BEWTY+Pos+Grund)
    cdc: full
    notes: "Bewegungsgrund-Texte (BWGR1/BWGR2). BEWTY=1+BWGR1=3 markiert
            teilstationaer; BWGR1 in (01,02,08) = PruefVV-relevant (Altbestand)."
  TN14U:
    schema: sap
    fhir: null                         # -> CodeSystem Bewegungsart
    tier: 1
    pk: [MANDT, EINRI, BEWTY, BWART]   # VERIFY
    cdc: full
    notes: "Bewegungsart-Texte. BWART VB=vorstationaer, AO=AOP (Altbestand)."
  TN14W:
    schema: sap
    fhir: null                         # -> CodeSystem Entlassungszustand
    tier: 1
    pk: [MANDT, ENTLZ]                 # VERIFY
    cdc: full
    notes: "Entlassung-Zustand-Texte."
  TN24T:
    schema: sap
    fhir: null                         # -> CodeSystem Behandlungskategorie
    tier: 1
    pk: [MANDT, BEKAT]                 # VERIFY
    cdc: full
    notes: "Behandlungskategorie-Texte (NFAL.BEKAT -> BLTXT, Altbestand)."
  NKDI:
    schema: sap
    fhir: null                         # -> hauseigener ICD-Katalog mit Klartext
    tier: 1
    pk: [MANDT, DKAT, DKEY]            # VERIFY (390.504 Zeilen)
    cdc: full
    notes: "KORRIGIERT (Altbestand): ICD-Katalog des Hauses (DKEY->DTEXT1-4,
            GSCHL-Restriktion, DTYP, ICD10GM_P301/P295) — Klartext-Quelle fuer
            Diagnosen, NICHT 'Katalog Diagnosearten'."
  NGPA:
    schema: sap
    fhir: [Organization, Practitioner]
    tier: 1
    pk: [MANDT, GPART]                 # verifiziert (261.210 Saetze)
    cdc: full
    notes: "Geschaeftspartner. Typ-Flags PERS/KOSTR/DEBIT/KRKHS/ARBTG; loest
            NPAT.HARNR/EARNR/UARNR (Haus-/einweisende Aerzte) auf."
  NKTR:
    schema: sap
    fhir: Organization                 # payer
    tier: 1
    pk: [MANDT, KOSTR]                 # verifiziert
    cdc: full
    notes: "Kostentraeger (17.336). KTART(Kassenart), KSSNM(Name), KKSNR(IK),
            PM301. Fuer Coverage.payor + Kassen-Analytik."
  NPER:
    schema: sap
    fhir: Practitioner
    tier: 2
    pk: [MANDT, PERNR]                 # VERIFY (236.106 = NGPA-PERS-Sicht)
    cdc: full
    notes: "Personen (behandelnde/einweisende) ohne HR-Schema."

  # ===== Tier 3 / sensibel / on demand ======================================
  NKSP:
    schema: sap
    fhir: null
    tier: 3
    pk: [MANDT, BELNR, POSNR]          # verifiziert
    cdc: ct
    notes: "KORRIGIERT (Runde 2): Kostenuebernahme-Splitting/Pflegesatz-Positionen,
            NICHT Sperrvermerke (die liegen in NPAT.VIPKZ/RISKF + NFAL.STASP)."
  NEHC:
    schema: sap
    fhir: null                         # eGK-Anreicherung (sensibel)
    tier: 3
    pk: [MANDT, LNCRD]                 # verifiziert
    cdc: ct
    notes: "eGK-Kartendaten (1 Mio, sensibel). Volle De-ID; Datenschutz beachten."
  N2OPDIAGNOSEN:
    schema: sap
    fhir: Condition                    # OP-Diagnosen (kompensiert duenne Arztbriefe)
    tier: 2
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: ct
    notes: "Strukturierte OP-Diagnosen (i.s.h.med)."
  NC301S:
    schema: sap
    fhir: null
    tier: 3
    pk: [MANDT, EINRI, FALNR, LFDNR]   # VERIFY
    cdc: watermark
    watermark_col: UPDAT
    notes: "Entgeltsaetze im §301-Strom. Einzige NC301-Tabelle, die das Haus laut
            DIAS-Baum aktiv auswertet (4 Referenzen) — Rest der NC301-Familie sind
            Uebertragungsprotokolle (Runde 2) und bleiben draussen."
