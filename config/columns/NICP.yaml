# Schmale Spaltenprojektion fuer NICP (46 Spalten). Verifiziert Runde 1:
# PK = MANDT+LNRIC (eigene Prozedur-Nr., NICHT FALNR/LFDNR).
table: NICP
schema: sap
select:
  - MANDT
  - LNRIC      # Prozedur-PK (verifiziert)
  - EINRI
  - FALNR      # denormalisiert vorhanden (verifiziert)
  - LFDBEW     # Bewegungsbezug (verbindet Prozedur mit NBEW)
  - ICPML      # OPS-Kode (verifiziert; ICPK1 existiert nicht)
  - ICPMK      # OPS-Katalog ('36'=OPS, verifiziert) -> TNK01
  - BTEXT      # Klartext (verifiziert)
  - BGDOP      # OP-Datum von (verifiziert; Partition)
  - ENDOP      # OP-Datum bis
  - BZTOP      # OP-Zeit von
  - EZTOP      # OP-Zeit bis
  - ORGFA      # durchfuehrende Fach-OE (verifiziert)
  - ORGPF      # Pflege-OE
  - OPART      # OP-Art -> TN14O (R16: im Haus LEER — defensiv behalten)
  - LSLOK      # Lokalisation -> TN26E (13% befuellt, R16)
  - DRG_RELEVANT
  - DRG_CATEGORY
  - CCL
  - STORN
  - ERDAT
  - UPDAT
