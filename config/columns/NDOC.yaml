# Schmale Spaltenprojektion fuer NDOC (Dokument-Koepfe, ~54 Mio Zeilen).
table: NDOC
schema: sap
select:
  - MANDT
  - EINRI      # VERIFY ob Teil des Schluessels
  - DOCID      # Dokument-ID VERIFY
  - FALNR      # Fallbezug VERIFY
  - PATNR      # Patientenbezug VERIFY
  - DOCTY      # Dokumenttyp VERIFY
  - DOCKA      # Dokumentkategorie VERIFY
  - DOCDT      # Dokumentdatum VERIFY
  - DOCST      # Status VERIFY
  - STORN      # VERIFY
  - ERDAT
  - UPDAT
