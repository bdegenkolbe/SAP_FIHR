# Schmale Spaltenprojektion fuer NDOC (~54 Mio; meistgenutzte Tabelle im DIAS-Baum).
# R8-KORREKTUR: NDOC ist die Zuordnung IS-H-Objekt <-> DVS-Dokument; die frueheren
# Feldnamen (DOCID/DOCKA/DOCDT/DOCTX) existieren NICHT.
table: NDOC
schema: sap
select:
  - MANDT
  - DOKAR      # Dokumentart (DVS)
  - DOKNR      # Dokumentnummer
  - DOKVR      # Version
  - DOKTL      # Teildokument
  - LFDDOK     # laufende Nummer (Teil des PK)
  - EINRI
  - PATNR      # -> NPAT (verifiziert R8)
  - FALNR      # -> NFAL
  - LFDBEW     # -> NBEW (Bewegungsbezug)
  - DTID       # Dokumenttyp -> N2DT (nicht repliziert -> Rohcode)
  - MEDOK      # 'X' = medizinisches Dokument
  - MITARB     # Autor -> NGPA/Practitioner
  - ORGDO      # dokumentierende OE -> NORG
  - DODAT      # Dokumentdatum
  - DOTIM      # Dokumentzeit
  - STORN
  - LOEKZ
  - ERDAT
  - UPDAT
