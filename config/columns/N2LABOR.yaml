# N2LABOR = Befund-KOPF (DVS-Dokument). Werte liegen in N2LABOR001 (322 Mio!).
table: N2LABOR
schema: sap
select:
  - MANDT
  - DOKAR
  - DOKNR
  - DOKVR
  - DOKTL
  - N2LAEINRI  # Einrichtung
  - N2LAPATNR  # -> NPAT
  - N2LAFALNR  # -> NFAL
  - N2LADATUM  # Befunddatum
  - N2LATIME   # Befundzeit
  - N2LASTATUS # Status (F/P/C/S -> DiagnosticReport.status)
