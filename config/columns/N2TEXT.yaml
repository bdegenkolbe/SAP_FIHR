# Schmale Spaltenprojektion fuer N2TEXT (~54 Mio). Volltext -> DuckDB-FTS, nicht FHIR.
# R8: PK = DVS-Schluessel + DOKTAB/DOKFLD/DOKOCC; Text in TXT (LCHR 8070).
table: N2TEXT
schema: sap
select:
  - MANDT
  - DOKAR
  - DOKNR
  - DOKVR
  - DOKTL
  - DOKTAB     # Tabellen-/Strukturbezug
  - DOKFLD     # Feldbezug
  - DOKOCC     # Occurrence (Zeile)
  - TXT        # Volltext (LCHR 8070) -> FTS
