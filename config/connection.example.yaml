# Verbindungs- und Laufzeitkonfiguration — Kopie nach connection.yaml, Werte setzen.
# connection.yaml ist gitignored (enthaelt Secrets).

source:
  host: sql-replica.klinik.intern      # MSSQL-Host der Qlik-Replika
  port: 1433
  database: replicate
  # Auth: entweder SQL-Login ODER Windows/NTLM (pytds unterstuetzt beides).
  # Fuer No-Admin + read-only: dedizierter Login mit db_datareader.
  auth: sql                            # sql | ntlm
  username: svc_sapfhir_ro
  password: ""                         # NICHT committen; leer -> Prompt / Env SAPFHIR_DB_PW
  prefer: pytds                        # pytds (No-Admin) | pyodbc
  encrypt: true
  trust_server_certificate: false
  cafile: null
  read_only_intent: true

scope:
  mandt: "100"                         # VERIFY Zielmandant
  einri: null                          # null = alle; sonst z.B. "0001"

extract:
  out_dir: data
  batch_rows: 100000                   # Startgroesse, adaptiv
  target_batch_seconds: 120
  max_connections: 2                   # Replika schonen
  window:                              # optionales Lastfenster (Backfill)
    start: "01:00"
    end: "06:00"
  parquet_compression: zstd
  parquet_level: 3

privacy:
  mode: pseudonymize                   # off | pseudonymize | anonymize
  secret_env: SAPFHIR_PRIVACY_SECRET   # HMAC-Secret aus Umgebungsvariable
  date_shift: true
  free_text_deid: true
  keep_filenames: false
  gate: enforce                        # enforce | warn | off

fhir:
  profile: r4                          # r4 | isik | mii   (Profil-Layer)
  id_namespace: "sapfhir"              # uuid5-Namensraum-Salt

terminology:
  loinc_map: config/loinc_map.csv      # hauseigene Laborcodes -> LOINC (optional)

graph:
  wiederaufnahme_tage: 30              # Schwelle fuer abgeleitete WIEDERAUFNAHME-Kante

api:
  host: 127.0.0.1
  port: 8471
  tls: true                            # HTTPS via selbstsigniertem Zertifikat
                                       # (config/certs; No-Admin). false = HTTP.
                                       # Bei Netz-Bind: Reverse-Proxy mit Haus-Zertifikat!

mcp:
  audit_log: data/audit/mcp.jsonl
  row_limit: 1000
  query_timeout_s: 30
  pseudonymize_view: true              # Namen/Adressen im MCP maskieren

authz:                                 # Berechtigung (docs/BERECHTIGUNGSKONZEPT.md)
  enabled: false                       # true = deny-by-default erzwingen (Patient-360-Gate)
  expand: true                         # Leitung erbt Unter-OEs (SETNODE-Rollup)
  # Groessengrenzen gegen Fail-Open (VERIFY_LOG R29/R30): SETLEAF mischt Aufbau-
  # organisation mit Auswertungs-/Berichtsgruppen (z.B. TEST_PFL mit 1.964 Kosten-
  # stellen). Sets ueber max_set_leaves berechtigen NICHT und der Rollup bricht an
  # ihnen ab; max_union_leaves begrenzt zusaetzlich die Gesamtsicht je Nutzer.
  # Haeuser mit legitim grossen Abteilungsgruppen hier hochsetzen (statt still auf
  # "nur eigene Kostenstelle" zurueckzufallen).
  max_set_leaves: 60
  max_union_leaves: 250
  # Rollen je Login (UPPER). Vollrollen sehen ALLE: medizincontrolling|it|admin.
  # Alles andere (z.B. 'abteilung') = Abteilungsregel ueber Kostenstelle. Ohne Eintrag: kein Zugriff.
  roles:
    # BJOERN: admin
    # MC-USER: medizincontrolling
    # STATIONSARZT: abteilung
  # Voraussetzung fuer die Abteilungsregel: auth-Marts materialisiert
  #   (python: sapfhir.authz.sql.build(con, src="bronze_current")) aus
  #   PA0105/PA0001/SETNODE/SETLEAF/NOEK + mcp.bewegung/mcp.fall.
